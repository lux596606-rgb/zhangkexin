# 推送到 main 后自动构建 dist/ 并发布到 GitHub Pages。
# 线上地址：https://lux596606-rgb.github.io/zhangkexin/
#
# 为什么必须有这个流程：仓库根目录的 index.html 是 Vite 的开发入口
# （<script src="/src/main.tsx">），它只能配合 `npm run dev` 使用。
# 把分支根目录直接当站点发布，浏览器会去请求 /src/main.tsx（404）→ 白屏。
# 真正能跑的是 `npm run build` 产出的 dist/，本流程负责构建并发布它。
name: 部署到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个发布；新推送会取消进行中的旧发布
concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建产物
        run: npm run build

      - name: 产物完整性检查
        run: npm run check:dist

      # 注意：仓库的 Pages 发布源必须是 Settings → Pages → Source = "GitHub Actions"。
      # 这个设置只能用管理员的网页/令牌改，工作流里的 GITHUB_TOKEN 改不了
      # （PUT /repos/{owner}/{repo}/pages 会返回 403 Resource not accessible by integration），
      # 所以这里不做自动切换，切换步骤见 DEPLOY.md 第 8 节。

      - name: 配置 Pages
        uses: actions/configure-pages@v6

      - name: 上传产物
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
